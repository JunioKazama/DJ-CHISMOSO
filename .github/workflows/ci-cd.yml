
name: DJ CHISMOSO - CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar codigo PHP
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validar sintaxis PHP
        shell: bash
        run: |
          set -e
          find hosting/ -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -print0 | xargs -0 -r -n1 php -l

  desplegar:
    name: Desplegar en hosting FTP
    needs: validar
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Publicar archivos mediante FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: hosting/
          server-dir: ./

          dry-run: false
          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.env*
            **/config.php
            **/db_setup.php
            **/*.sql
            **/*.log
            **/backups/**
